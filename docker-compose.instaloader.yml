# Independent collector; the application remains the account/schedule authority.
services:
  instaloader:
    build:
      context: ./services/instaloader
    image: ig-event-instaloader:${INSTALOADER_IMAGE_TAG:-local}
    container_name: ig-event-instaloader
    environment:
      INSTALOADER_API_TOKEN: ${INSTALOADER_API_TOKEN:?Set the private collector token}
      INSTALOADER_STATE_DIR: /var/lib/eventzeka-instaloader
      INSTALOADER_SESSION_FILE: /run/instaloader-session/session
      INSTALOADER_SESSION_USERNAME: ${INSTALOADER_SESSION_USERNAME:-}
      INSTALOADER_ALLOW_ANONYMOUS: "false"
    volumes:
      - instaloader-state:/var/lib/eventzeka-instaloader
      - ${INSTALOADER_SESSION_DIR:-./.instaloader-session}:/run/instaloader-session:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    networks:
      collector:
        aliases: [eventzeka-instaloader]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  instaloader-state:

networks:
  collector:
    external: true
    name: ${INSTALOADER_NETWORK:-n8n-compose_default}
