name: Release Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Reel encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run release gates
        run: npm run qa:release
