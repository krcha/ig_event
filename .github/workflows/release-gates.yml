name: Release Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup collector Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/instaloader/requirements.txt

      - name: Verify pinned collector offline
        run: |
          python -m pip install -r services/instaloader/requirements.txt
          python -m unittest discover -s services/instaloader -p 'test_*.py' -v

      - name: Run release gates
        run: npm run qa:release
